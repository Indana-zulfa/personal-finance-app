<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget - Personal Finance App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header and Navigation -->
    <header>
        <h1>Personal Finance App</h1>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="transactions.html">Transactions</a>
            <a href="analytics.html">Analytics</a>
            <a href="budget.html">Budget</a>
        </nav>
    </header>

    <main>

        <!-- Budget Header -->
        <section>
            <h2>Budget Management</h2>
            <p>
                Set and monitor your monthly spending budget.
            </p>
        </section>

        <!-- Set Budget -->
        <section>
            <h2>Set Budget</h2>

            <form id="budget-form">

                <div class="form-group">
                    <label for="budget-month">
                        Select Month
                    </label>

                    <input
                        type="month"
                        id="budget-month"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="budget-amount">
                        Budget Amount
                    </label>

                    <input
                        type="number"
                        id="budget-amount"
                        placeholder="Enter budget amount"
                        min="0"
                        required
                    >
                </div>

                <div class="form-actions">

                    <button
                        type="submit"
                        id="budget-submit"
                    >
                        Set Budget
                    </button>

                    <button
                        type="button"
                        id="cancel-budget"
                        hidden
                    >
                        Cancel
                    </button>

                </div>

            </form>
        </section>

        <!-- Budget Overview -->
        <section>
            <h2>Budget Overview</h2>

            <div class="form-group">
                <label for="budget-overview-month">
                    Select Month
                </label>

                <select id="budget-overview-month">
                    <option value="">Select month</option>
                </select>
            </div>

            <div class="budget-cards">

                <div class="budget-card">
                    <h3>Total Budget</h3>
                    <p id="overview-budget">
                        Rp 0
                    </p>
                </div>

                <div class="budget-card">
                    <h3>Total Spent</h3>
                    <p id="overview-spent">
                        Rp 0
                    </p>
                </div>

                <div class="budget-card">
                    <h3>Remaining Budget</h3>
                    <p id="overview-remaining">
                        Rp 0
                    </p>
                </div>

            </div>

            <div class="progress-container">

                <div class="progress-bar">
                    <div
                        id="budget-progress"
                        class="progress-fill"
                    ></div>
                </div>

                <p id="budget-progress-text">
                    0% used
                </p>

            </div>

        </section>

    </main>

    <!-- Main JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
